{% extends "base.html" %}{% block body %}
<section class="max-w-[1800px] mx-auto p-4 md:p-6 pb-40 md:pb-32">
    <div id="top" class="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4 mb-6"></div>
    <div class="grid grid-cols-1 xl:grid-cols-[420px_1fr_420px] gap-6 items-start">
        <div class="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col h-[50vh] xl:h-[70vh]">
            <div class="flex justify-between items-end mb-4">
                <h2 class="font-extrabold text-xl text-slate-800">Priority Queue</h2>
                <span class="bg-teal-50 text-teal-700 border border-teal-100 text-xs font-bold px-2.5 py-1 rounded-md shadow-sm" id="safeN">0 Safe</span>
            </div>
            <div class="flex flex-wrap gap-2 mb-4" id="flt"></div>
            <div id="q" class="space-y-3 flex-1 overflow-y-auto pr-2 custom-scrollbar"></div>
        </div>

        <div class="flex flex-col h-[60vh] xl:h-[70vh]">
            <div class="flex flex-wrap gap-2 mb-3" id="lay"></div>
            <div class="relative rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 bg-white p-2 flex-1 flex flex-col">
                <div id="map" class="rounded-xl md:rounded-2xl overflow-hidden z-10 w-full flex-1"></div>
                <div class="absolute bottom-4 left-4 z-[400] bg-white/90 backdrop-blur border border-slate-200/80 px-3 py-2 rounded-xl shadow-md pointer-events-none flex flex-wrap gap-3 md:gap-4 text-[10px] md:text-[11px] font-bold text-slate-600 max-w-[80%] md:max-w-none">
                    <span class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-blue-500 opacity-50"></div>Under 1h</span>
                    <span class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-amber-500 opacity-50"></div>1–4h</span>
                    <span class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-teal-500 opacity-50"></div>4h+</span>
                    <span class="flex items-center gap-1.5"><div class="w-3 border-t-2 border-dashed border-orange-500"></div>Gap</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col h-[50vh] xl:h-[70vh]">
            <div class="flex gap-1 mb-5 overflow-x-auto p-1 bg-slate-100 rounded-xl border border-slate-200 shrink-0 custom-scrollbar" id="tabs"></div>
            <div id="pane" class="flex-1 overflow-y-auto pr-2 custom-scrollbar flex flex-col"></div>
        </div>
    </div>
</section>

<button id="show-bar" class="fixed bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 z-[1050] bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-6 rounded-full shadow-2xl transition-all duration-500 translate-y-[200%] opacity-0 pointer-events-none flex items-center gap-2 border border-slate-700 whitespace-nowrap text-sm">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg> Show Controls
</button>

<div id="control-bar" class="fixed bottom-4 md:bottom-6 inset-x-4 md:inset-x-6 z-[1100] max-w-[1750px] mx-auto bg-white/95 backdrop-blur-xl border border-slate-200 shadow-2xl rounded-2xl md:rounded-3xl p-4 md:px-6 md:py-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 md:gap-6 transition-all duration-500 ease-in-out">
    <div class="flex items-start md:items-center gap-4 md:gap-6 w-full md:max-w-4xl">
        <div class="shrink-0 text-center">
            <div class="text-[9px] md:text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-0.5">Level</div>
            <b id="lv" class="text-3xl md:text-4xl font-black text-blue-600 tracking-tighter leading-none">30%</b>
        </div>
        <div class="flex-1 w-full">
            <div class="flex items-center gap-1 mb-2 bg-slate-100 p-1 rounded-lg w-fit border border-slate-200">
                <button id="src-man" class="text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all bg-white text-orange-600 shadow-sm border border-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span> Override</button>
                <button id="src-live" class="text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all text-slate-500 hover:text-slate-800">Live API</button>
            </div>
            <div class="relative pt-1 w-full">
                <input id="s" type="range" min="30" max="95" value="30" class="w-full h-2.5 md:h-3 bg-slate-100 rounded-lg appearance-none cursor-pointer focus:outline-none focus:ring-4 focus:ring-blue-100 shadow-inner hover:bg-slate-200 transition-all">
                <div class="flex justify-between text-[8px] md:text-[10px] font-extrabold text-slate-400 mt-2 uppercase tracking-widest px-1"><span id="src-msg" class="text-slate-400 truncate">Slider Unlocked: 30 (Prepare) &rarr; 80 (Dispatch)</span></div>
            </div>
            <div id="live-metrics" class="hidden mt-3 bg-teal-50 border border-teal-200 rounded-xl p-3 shadow-sm transition-all w-full md:absolute md:bottom-[calc(100%+1.5rem)] md:w-96 md:left-24">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[9px] font-extrabold text-teal-700 uppercase tracking-widest">Active Data Feed</span>
                    <span class="text-[9px] font-extrabold text-teal-600 uppercase flex items-center gap-1"><div class="w-1.5 h-1.5 bg-teal-500 rounded-full animate-pulse"></div>Connected</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white rounded-lg p-2 text-center border border-teal-100 shadow-sm"><div class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Location</div><div id="live-loc" class="text-xs font-black text-slate-700">--</div></div>
                    <div class="bg-white rounded-lg p-2 text-center border border-teal-100 shadow-sm"><div class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Temp</div><div id="live-temp" class="text-xs font-black text-slate-700">--</div></div>
                    <div class="bg-white rounded-lg p-2 text-center border border-teal-100 shadow-sm"><div class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Source</div><div id="live-src" class="text-xs font-black text-blue-600 truncate">--</div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-2 md:gap-3 shrink-0 w-full md:w-auto justify-between md:justify-end">
        <div class="flex gap-2 w-full md:w-auto">
            <button id="play" class="flex-1 md:flex-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl border border-slate-200 transition-all text-xs md:text-sm shadow-sm whitespace-nowrap">Play</button>
            <button id="ctl" class="flex-1 md:flex-auto bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition-all text-xs md:text-sm flex items-center justify-center gap-2"><svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg> <span class="hidden sm:inline">Parameters</span></button>
        </div>
        <button id="hide-bar" class="shrink-0 bg-white hover:bg-slate-50 text-slate-500 hover:text-slate-800 font-bold p-2.5 rounded-xl border border-slate-200 shadow-sm transition-all" title="Hide Controls"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg></button>
    </div>
</div>

<dialog id="dlg" class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-[min(95vw,420px)] p-0 backdrop:bg-slate-900/50 backdrop:backdrop-blur-sm m-auto">
    <div class="p-4 md:p-5 border-b border-slate-100 bg-slate-50 rounded-t-2xl"><h3 id="dt" class="font-extrabold text-lg text-slate-800"></h3></div>
    <div class="p-4 md:p-5"><div id="db" class="text-sm space-y-3 text-slate-600 mb-6 font-medium"></div><form method="dialog"><button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2.5 rounded-xl border border-slate-200 transition-all">Close</button></form></div>
</dialog>

<script>
let m,D,tab='Plan',flt='All',rate=.4,outage=null,cellular=0,boats=3,go=null,log=[],lay={Flood:1,'Land routes':1,'Water routes':1,'Air routes':1,'Rescue gap':1};
const LK={Flood:['flood'],'Land routes':['land'],'Water routes':['water'],'Air routes':['air'],'Rescue gap':['gap']};
const lvl=()=>+$('#s').value, out=()=>outage??Math.round(lvl()*.6);

(async()=>{
m=await mkMap('map');

$('#hide-bar').onclick = () => {
    $('#control-bar').classList.add('translate-y-[150%]', 'opacity-0');
    $('#show-bar').classList.remove('translate-y-[200%]', 'opacity-0', 'pointer-events-none');
};
$('#show-bar').onclick = () => {
    $('#control-bar').classList.remove('translate-y-[150%]', 'opacity-0');
    $('#show-bar').classList.add('translate-y-[200%]', 'opacity-0', 'pointer-events-none');
};

function buildToggles() {
    $('#lay').innerHTML=Object.keys(lay).map(k=>{
        const on = lay[k];
        const c = on ? 'bg-slate-800 text-white border-slate-800 shadow-md' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50';
        return `<button class="text-[11px] md:text-xs font-bold px-2.5 md:px-3 py-1.5 rounded-lg border transition-all ${c}" data-k="${k}">${k}</button>`;
    }).join('');
    $$('#lay button').forEach(b=>b.onclick=()=>{ lay[b.dataset.k]^=1; buildToggles(); vis(); });
}
buildToggles();

function buildTabs() {
    $('#tabs').innerHTML=['Plan','Fleet','Alerts','Equity','Log'].map(t=>{
        const on = t==tab;
        const c = on ? 'bg-white text-blue-600 shadow-sm font-extrabold' : 'text-slate-500 hover:text-slate-700 font-bold hover:bg-slate-200/50';
        return `<button class="flex-1 text-[11px] md:text-xs px-2.5 md:px-3 py-2 rounded-lg transition-all ${c} whitespace-nowrap" data-t="${t}">${t}</button>`;
    }).join('');
    $$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; buildTabs(); pane();});
}
buildTabs();

$('#s').oninput=draw;
$('#play').onclick=()=>{
    if(go){clearInterval(go);go=null;$('#play').textContent='Play';$('#play').classList.remove('bg-blue-100','text-blue-700','border-blue-200');return}
    $('#play').textContent='Pause';$('#play').classList.add('bg-blue-100','text-blue-700','border-blue-200');
    go=setInterval(()=>{$('#s').value=lvl()>=95?30:lvl()+1;draw()},500)
};

$('#ctl').onclick=()=>{
    $('#dt').textContent='Simulation Parameters';
    $('#db').innerHTML=`
        <label class="block">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider"><span>Flood rise rate</span><span id="c1" class="text-blue-600">${rate} m/hr</span></div>
            <input id="r1" type="range" min=".2" max="2.5" step=".1" value="${rate}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer focus:outline-none accent-blue-500">
        </label>
        <label class="block pt-3">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider"><span>Power outage</span><span id="c2" class="text-blue-600">${out()}%</span></div>
            <input id="r2" type="range" min="0" max="100" value="${out()}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer focus:outline-none accent-blue-500">
        </label>
        <label class="block pt-3">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider"><span>Cellular Outage</span><span id="c4" class="text-blue-600">${cellular}%</span></div>
            <input id="r4" type="range" min="0" max="100" value="${cellular}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer focus:outline-none accent-blue-500">
        </label>
        <label class="block pt-3">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider"><span>Boats on duty</span><span id="c3" class="text-blue-600">${boats}</span></div>
            <input id="r3" type="range" min="0" max="10" value="${boats}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer focus:outline-none accent-blue-500">
        </label>`;
    $('#r1').oninput=e=>{rate=+e.target.value;$('#c1').textContent=rate+' m/hr';draw()};
    $('#r2').oninput=e=>{outage=+e.target.value;$('#c2').textContent=outage+'%';draw()};
    $('#r4').oninput=e=>{cellular=+e.target.value;$('#c4').textContent=cellular+'%';draw()};
    $('#r3').oninput=e=>{boats=+e.target.value;$('#c3').textContent=boats;draw()};
    $('#dlg').showModal();
};

$('#src-live').onclick = async () => {
    $('#src-live').className = 'text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all bg-white text-blue-600 shadow-sm border border-slate-200 flex items-center gap-1.5';
    $('#src-live').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-teal-500 animate-pulse"></span> Live API';
    $('#src-man').className = 'text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all text-slate-500 hover:text-slate-800';
    $('#s').disabled = true;
    $('#s').classList.add('opacity-50', 'cursor-not-allowed', 'bg-slate-200');
    $('#s').classList.remove('cursor-pointer', 'hover:bg-slate-200');
    $('#src-msg').innerHTML = 'Connecting to external weather satellites...';
    $('#src-msg').className = 'text-teal-600 truncate';
    $('#live-metrics').classList.remove('hidden');
    try {
        const tel = await J('/api/telemetry');
        if(tel.ok) {
            $('#live-loc').textContent = tel.location;
            $('#live-temp').textContent = tel.temperature + '°C';
            $('#live-src').textContent = tel.source;
            $('#s').value = tel.calculated_level;
            $('#src-msg').innerHTML = `Auto-calibrated to ${tel.calculated_level}% based on live conditions.`;
            if(typeof draw === 'function') draw();
        } else { $('#src-msg').innerHTML = 'Live API Error. Using fallback data.'; }
    } catch(e) { $('#src-msg').innerHTML = 'Connection failed. Check network.'; }
};

$('#src-man').onclick = () => {
    $('#src-man').className = 'text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all bg-white text-orange-600 shadow-sm border border-slate-200 flex items-center gap-1.5';
    $('#src-man').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span> Override';
    $('#src-live').className = 'text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest px-3 py-1.5 rounded-md transition-all text-slate-500 hover:text-slate-800';
    $('#src-live').innerHTML = 'Live API';
    $('#s').disabled = false;
    $('#s').classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-200');
    $('#s').classList.add('cursor-pointer', 'hover:bg-slate-200');
    $('#src-msg').innerHTML = 'Slider Unlocked: 30 (Prepare) &rarr; 80 (Dispatch)';
    $('#src-msg').className = 'text-slate-400 truncate';
    $('#live-metrics').classList.add('hidden');
};

draw();
})();

function vis(){for(const[k,on]of Object.entries(lay))LK[k].forEach(g=>on?m.addLayer(m.G[g]):m.removeLayer(m.G[g]))}

window.why = function(id) {
    const r=D.rows.find(x=>x.id==id),i=D.rows.indexOf(r);
    $('#dt').textContent=`Priority Logic: ${r.name}`;
    $('#db').innerHTML=[
        `<div class="flex justify-between border-b border-slate-100 pb-2"><span>Survival clock limit</span><b class="text-slate-800">${fmt(r.tc)} (${r.driver})</b></div>`,
        `<div class="flex justify-between border-b border-slate-100 pb-2"><span>Uncertainty factor</span><b class="text-slate-800">k = ${r.k} &rarr; ${fmt(r.tc_eff)}</b></div>`,
        `<div class="flex justify-between border-b border-slate-100 pb-2"><span>Severity (1-5)</span><b class="text-slate-800">${r.severity}</b></div>`,
        `<div class="flex justify-between border-b border-slate-100 pb-2"><span>Final Priority Score</span><b class="text-blue-600 font-black">${r.priority}</b></div>`,
        `<div class="flex justify-between pt-1"><span>Rescue Gap</span><b class="${r.gap<0?'text-orange-600':'text-teal-600'} font-black">${r.gap<0?'−':'+'}${fmt(Math.abs(r.gap))}</b></div>`
    ].join('');
    $('#dlg').showModal();
}

async function draw(){
    const lv=lvl();$('#lv').textContent=lv+'%';
    D=await J(`/api/state?level=${lv}&rate=${rate}&outage=${out()}&cellular=${cellular}&boats=${boats}`);
    const st=D.stage;
    
    $('#top').innerHTML = Object.entries(D.zones).map(([z,v])=>{
        const isDanger = v >= 80, isWarn = v >= 60 && v < 80;
        const c = isDanger ? {text:'text-orange-700', bg:'bg-orange-100', bar:'var(--coral-accent)'} : 
                  isWarn ? {text:'text-amber-700', bg:'bg-amber-100', bar:'#f59e0b'} : 
                  {text:'text-blue-700', bg:'bg-blue-100', bar:'var(--blue-primary)'};
        return `
        <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div class="flex justify-between items-center mb-1.5 md:mb-2">
                <span class="text-xs md:text-sm font-bold text-slate-700 truncate mr-2">${z}</span>
                <span class="text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest text-slate-400 shrink-0">${stageOf(v)}</span>
            </div>
            <div class="flex items-baseline gap-1 mb-2 md:mb-3">
                <b class="text-2xl md:text-3xl font-black ${c.text} tracking-tighter">${v}</b><span class="${c.text} font-bold text-xs md:text-sm">%</span>
            </div>
            <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden shadow-inner">
                <div class="h-full rounded-full transition-all duration-700 ease-out" style="width:${v}%; background:${c.bar}"></div>
            </div>
        </div>`;
    }).join('') + `
    <div class="bg-blue-600 p-3 md:p-4 rounded-2xl shadow-md border border-blue-500 text-white flex flex-col justify-center relative overflow-hidden hidden lg:flex">
        <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/20 rounded-full blur-2xl"></div>
        <div class="relative z-10">
            <div class="text-[10px] font-extrabold uppercase tracking-widest text-blue-200 mb-0.5">Current Stage</div>
            <b class="text-2xl md:text-3xl font-black tracking-tight block mb-1.5">${st}</b>
            <div class="text-[11px] md:text-xs text-blue-100 font-medium leading-snug">${st=='Prepare'?'Registering households.':st=='Watch'?'Confirming needs.':st=='Warn'?'Alerting households.':'Crews dispatched.'}</div>
        </div>
    </div>`;

    const reg=D.rows.filter(r=>r.registered), nr=D.rows.filter(r=>!r.registered), sil=D.rows.filter(r=>r.silent&&!r.safe);
    $('#flt').innerHTML=[['All',D.rows.length],['Registered',reg.length],['Unknown',nr.length],['No reply',sil.length]].map(([k,n])=>{
        const on = flt==k;
        const c = on ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-white';
        return `<button class="text-[11px] md:text-xs font-bold px-2.5 md:px-3 py-1.5 rounded-lg border transition-all shadow-sm whitespace-nowrap ${c}" data-f="${k}">${k} <span class="${on?'text-slate-300':'text-slate-400'} ml-1">${n}</span></button>`;
    }).join('');
    $('#safeN').textContent=D.rows.filter(r=>r.safe).length+' Safe';

    const list=D.rows.filter(r=>!r.safe&&(flt=='All'||flt=='Registered'&&r.registered||flt=='Unknown'&&!r.registered||flt=='No reply'&&r.silent));
    $('#q').innerHTML=list.map(r=>{
        const n = D.rows.indexOf(r)+1;
        const isCrit = r.tc_eff<60, isUrg = r.tc_eff<240;
        const c = isCrit ? {text:'text-orange-700', bg:'bg-orange-50', border:'border-orange-200', left:'bg-orange-500'} : 
                  isUrg ? {text:'text-amber-700', bg:'bg-amber-50', border:'border-amber-200', left:'bg-amber-400'} : 
                  {text:'text-teal-700', bg:'bg-teal-50', border:'border-teal-200', left:'bg-teal-500'};
        
        return `
        <div class="relative bg-white p-3.5 md:p-4 rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all group">
            <div class="absolute left-0 top-0 bottom-0 w-1 ${c.left}"></div>
            <div class="flex justify-between gap-2 md:gap-3 pl-2">
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5 md:gap-2 mb-1.5 flex-wrap">
                        <span class="text-[10px] font-black text-slate-300">#${n}</span>
                        <span class="text-[9px] md:text-[10px] font-bold px-1.5 md:px-2 py-0.5 rounded flex items-center gap-1 ${c.bg} ${c.text} border ${c.border}">
                            <div class="w-1.5 h-1.5 rounded-full ${c.left}"></div>${isCrit?'Critical':isUrg?'Urgent':'Stable'}
                        </span>
                        ${r.gap<0?`<span class="text-[9px] md:text-[10px] font-bold text-orange-600 bg-orange-50 px-1.5 md:px-2 py-0.5 rounded border border-orange-200 shadow-sm animate-pulse whitespace-nowrap">Gap &minus;${fmt(-r.gap)}</span>`:''}
                        ${r.comms_lost ? `<span class="text-[9px] md:text-[10px] font-bold text-red-600 bg-red-50 px-1.5 md:px-2 py-0.5 rounded border border-red-200 shadow-sm animate-pulse whitespace-nowrap ml-1" title="Comms Blackout">📵 Lost</span>` : ''}
                    </div>
                    <b class="text-xs md:text-sm text-slate-800 block mb-1 truncate">${r.name}</b>
                    <div class="text-[10px] md:text-[11px] font-medium text-slate-500 truncate">${r.driver} &middot; ${r.people} ppl &middot; ${r.zone}</div>
                </div>
                <div class="text-right flex flex-col justify-between shrink-0">
                    <div>
                        <div class="text-[8px] md:text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-0.5">Time Left</div>
                        <b class="mono text-base md:text-lg ${c.text} block leading-none">${fmt(r.tc_eff)}</b>
                    </div>
                    <button class="text-[9px] md:text-[10px] font-bold text-slate-400 hover:text-blue-600 transition-colors text-right underline underline-offset-2 mt-2 md:mt-0" onclick="why(${r.id})">Logic</button>
                </div>
            </div>
        </div>`;
    }).join('')||'<div class="p-6 md:p-8 text-center text-slate-400 font-medium text-sm border-2 border-dashed border-slate-200 rounded-xl">Queue empty.</div>';

    reset(m,['flood','land','water','air','gap','pins','units']);flood(m,D.zones);units(m,D.units);
    D.rows.forEach(r=>{if(r.safe)return;const urgent=r.tc_eff<360;pin(m,r,r.gap<0&&urgent);if(urgent&&r.unit){const u=D.units.find(x=>x.id==r.unit);u&&route(m,u,r)}if(r.gap<0&&urgent)gapMark(m,r)});vis();pane()
}

function pane(){
    const urg=D.rows.filter(r=>!r.safe&&r.tc_eff<360), ok=urg.filter(r=>r.gap>=0), bad=urg.filter(r=>r.gap<0), P=$('#pane');
    
    if(tab=='Plan'){
        const d=lvl()>=80;
        P.innerHTML=`
        <p class="text-slate-500 text-xs mb-3 md:mb-4 font-medium leading-relaxed">${d?'Dispatch stage active. Priority routing generated.':`${D.stage} stage. Projection only. Crews remain at depots.`}</p>
        <div class="grid grid-cols-3 gap-2 md:gap-3 mb-3 md:mb-4 shrink-0">
            <div class="bg-teal-50 border border-teal-100 p-2.5 md:p-3 rounded-xl text-center shadow-sm">
                <b class="text-xl md:text-2xl text-teal-600 block leading-none mb-1">${ok.reduce((a,r)=>a+r.people,0)}</b><span class="text-[8px] md:text-[9px] font-extrabold text-teal-700 uppercase tracking-wider">Reached</span>
            </div>
            <div class="bg-orange-50 border border-orange-100 p-2.5 md:p-3 rounded-xl text-center shadow-sm">
                <b class="text-xl md:text-2xl text-orange-600 block leading-none mb-1">${bad.length}</b><span class="text-[8px] md:text-[9px] font-extrabold text-orange-700 uppercase tracking-wider">Gap</span>
            </div>
            <div class="bg-blue-50 border border-blue-100 p-2.5 md:p-3 rounded-xl text-center shadow-sm">
                <b class="text-xl md:text-2xl text-blue-600 block leading-none mb-1">${new Set(urg.map(r=>r.unit)).size}</b><span class="text-[8px] md:text-[9px] font-extrabold text-blue-700 uppercase tracking-wider">Crews</span>
            </div>
        </div>
        
        <div class="flex gap-2 mb-2 shrink-0">
            <button id="go" class="flex-1 font-bold py-2.5 md:py-3 rounded-xl shadow-md transition-all text-xs md:text-sm ${d?'bg-blue-600 hover:bg-blue-700 text-white':'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'}" ${d?'':'disabled'}>
                ${d?'Confirm Dispatch Protocol':'Dispatch Locked (< 80%)'}
            </button>
            ${!d ? `<button id="override" class="shrink-0 bg-orange-50 hover:bg-orange-100 text-orange-700 font-bold px-3 md:px-4 rounded-xl shadow-sm border border-orange-200 transition-all text-[10px] md:text-xs flex flex-col items-center justify-center leading-tight"><span>Manual</span><span>Override</span></button>` : ''}
        </div>
        ${!d ? `<p class="text-[9px] md:text-[10px] text-slate-400 text-right mb-4">Override forces immediate dispatch. This action is logged to your operator ID.</p>` : '<div class="mb-4"></div>'}
        
        <div class="text-[9px] md:text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2 md:mb-3 shrink-0">Projected Routing</div>
        <div class="space-y-2 flex-1 pb-2">
        ${urg.length?urg.slice(0,15).map(r=>`
            <div class="flex justify-between items-center text-[11px] md:text-xs bg-white border border-slate-200 px-2.5 md:px-3 py-2 md:py-2.5 rounded-lg shadow-sm">
                <div class="flex items-center gap-1.5 md:gap-2 overflow-hidden"><span class="font-bold text-slate-700 shrink-0">${r.unit||'None'}</span><span class="text-slate-300 shrink-0">&rarr;</span><span class="font-medium text-slate-600 truncate">${r.name}</span></div>
                <span class="mono font-bold ${r.gap<0?'text-orange-600':'text-teal-600'} bg-slate-50 px-1.5 md:px-2 py-0.5 rounded border border-slate-100 shadow-inner shrink-0 ml-2">ETA ${r.eta==null?'n/a':fmt(r.eta)}</span>
            </div>`).join('') : '<div class="text-center text-slate-400 text-xs py-4 border border-dashed border-slate-200 rounded-lg">No urgent tasks under 6 hours.</div>'}
        </div>`;
        
        const confirmAction = () => {
            log.unshift(`${new Date().toLocaleTimeString()}: dispatch confirmed manually at ${lvl()}% for ${urg.length} households`);
            const g = $('#go');
            if(g) { g.textContent='Dispatch confirmed'; g.disabled=true; g.className='w-full shrink-0 font-bold py-2.5 md:py-3 rounded-xl shadow-sm transition-all mb-4 text-xs md:text-sm bg-teal-50 text-teal-700 border border-teal-200'; }
            if($('#override')) $('#override').remove();
        };
        if($('#go') && d) $('#go').onclick = confirmAction;
        if($('#override')) $('#override').onclick = confirmAction;
    }
    
    if(tab=='Fleet'){
        P.innerHTML=D.units.map(u=>{
            const a=D.rows.filter(r=>r.unit==u.id&&r.tc_eff<360);
            const totalScheduled = a.reduce((sum, r) => sum + r.people, 0);
            return `<div class="bg-white border border-slate-200 p-2.5 md:p-3 rounded-xl mb-2 flex justify-between items-center shadow-sm">
                <div>
                    <span class="text-xs md:text-sm font-bold text-slate-700 flex items-center gap-2"><span class="text-base md:text-lg opacity-80">${u.type=='boat'?'⛵':u.type=='air'?'🚁':'🚚'}</span> ${u.id}</span>
                    <div class="text-[10px] font-medium text-slate-500 mt-0.5 ml-8">Capacity: ${u.cap} ppl/trip</div>
                </div>
                <div class="text-right">
                    <span class="${a.length?'text-orange-600 bg-orange-50 border-orange-200':'text-teal-600 bg-teal-50 border-teal-200'} border text-[9px] md:text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md shadow-sm block mb-1">${a.length?a.length+' stops queued':'Standing by'}</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">${totalScheduled} ppl scheduled</span>
                </div>
            </div>`}).join('');
    }
    
    if(tab=='Alerts'){
        P.innerHTML=(bad.map(r=>`<div class="bg-orange-50 border border-orange-200 p-3 rounded-xl mb-2 shadow-sm text-[11px] md:text-xs text-orange-900 font-medium"><b class="text-orange-700 block mb-0.5 uppercase tracking-wider text-[9px] md:text-[10px]">Rescue gap</b> ${r.name} has a clock of ${fmt(r.tc_eff)}, but nearest crew ETA is ${r.eta==null?'none':fmt(r.eta)}.</div>`).join('') + 
        D.rows.filter(r=>r.silent&&!r.safe&&r.severity>=4).map(r=>`<div class="bg-amber-50 border border-amber-200 p-3 rounded-xl mb-2 shadow-sm text-[11px] md:text-xs text-amber-900 font-medium"><b class="text-amber-700 block mb-0.5 uppercase tracking-wider text-[9px] md:text-[10px]">No reply</b> ${r.name} has not checked in (Severity ${r.severity}).</div>`).join('')) || '<p class="text-slate-400 text-xs text-center border border-dashed border-slate-200 p-4 rounded-xl">No active alerts.</p>';
    }
    
    if(tab=='Equity'){
        const by=k=>D.rows.filter(r=>!!r.registered==k&&!r.safe),av=a=>a.length?Math.round(a.reduce((s,r)=>s+r.gap,0)/a.length):0;
        P.innerHTML=`<p class="text-slate-500 text-[11px] md:text-xs mb-3 md:mb-4 font-medium">Coverage equity split.</p>
        ${[['Registered',by(true)],['Not registered',by(false)]].map(([k,a])=>`<div class="bg-white border border-slate-200 p-3 md:p-4 rounded-xl mb-3 shadow-sm">
            <b class="text-xs md:text-sm text-slate-800">${k}</b> <span class="text-[10px] md:text-xs text-slate-500 ml-1">(${a.length} households)</span>
            <div class="text-[11px] md:text-xs font-medium text-slate-600 mt-2 bg-slate-50 p-2 rounded-lg border border-slate-100">Avg gap: <b class="${av(a)<0?'text-orange-600':'text-teal-600'}">${av(a)<0?'−':''}${fmt(Math.abs(av(a)))}</b> &middot; ${a.filter(r=>r.gap<0).length} gaps</div>
        </div>`).join('')}<p class="text-slate-400 text-[9px] md:text-[10px] leading-tight">Unregistered households get shorter clocks to force early discovery.</p>`;
    }
    
    if(tab=='Log'){
        P.innerHTML=log.length?log.map(l=>`<div class="bg-slate-50 border border-slate-200 p-2.5 md:p-3 rounded-xl mb-2 text-[11px] md:text-xs text-slate-600 font-medium shadow-sm">${l}</div>`).join(''):'<p class="text-slate-400 text-xs text-center border border-dashed border-slate-200 p-4 rounded-xl">No operator actions logged.</p>';
    }
}
</script>
{% endblock %}
