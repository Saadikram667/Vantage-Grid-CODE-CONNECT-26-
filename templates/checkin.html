{% extends "base.html" %}{% block body %}
<section class="max-w-xl mx-auto p-5 py-12">
    <div class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-800 pb-2">Check In</h1>
        <p class="text-slate-500 text-lg">Update your status or buy more time.</p>
    </div>

    <!-- Security Gate: Household ID Lookup -->
    <div id="lookup-panel" class="card p-6 md:p-8 shadow-md border border-slate-200 bg-white mb-8">
        <label class="block text-sm font-bold text-slate-700 mb-2">Household ID Number</label>
        <div class="flex gap-3">
            <input id="hh-id" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" placeholder="e.g. 12" type="number">
            <button id="find-hh" class="bg-blue-600 text-white font-bold px-8 rounded-xl hover:bg-blue-700 transition-all shadow-sm">Find</button>
        </div>
        <p id="lookup-err" class="text-red-500 font-bold text-sm mt-3 hidden"></p>
        
        <div class="mt-5 pt-5 border-t border-slate-100 flex justify-between items-center">
            <p class="text-xs text-slate-500">We do not provide a public list for privacy.</p>
            <button id="show-recover" class="text-xs font-bold text-blue-600 hover:text-blue-800 transition-colors underline underline-offset-2">Forgot your ID?</button>
        </div>

        <!-- Recovery Flow (Hidden by Default) -->
        <div id="recover-panel" class="hidden mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wider">Recover via registered phone</label>
            <div class="flex gap-2">
                <input id="rec-phone" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter phone number">
                <button id="btn-recover" class="bg-slate-800 text-white font-bold px-4 py-2 rounded-lg hover:bg-slate-900 text-sm">Recover</button>
            </div>
            <p id="rec-msg" class="text-xs font-bold mt-2 hidden"></p>
        </div>
    </div>

    <!-- Main Active Panel (Hidden until ID is verified) -->
    <div id="active-panel" class="hidden transition-all duration-300">
        
        <div class="card p-6 md:p-8 shadow-xl shadow-slate-200/50 border border-slate-200 relative overflow-hidden bg-white">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-50 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 relative z-10">
                <div>
                    <div class="inline-flex items-center gap-2 bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3" id="zn"></div>
                    <div class="text-sm font-medium text-slate-500 flex items-center gap-2" id="why"></div>
                </div>
                <div class="text-left md:text-right w-full md:w-auto bg-slate-50 md:bg-transparent p-4 md:p-0 rounded-xl border border-slate-100 md:border-none">
                    <div class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1 flex items-center md:justify-end gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Time left
                    </div>
                    <b class="mono text-5xl tracking-tight" id="tl">--</b>
                </div>
            </div>
            
            <div class="h-3 rounded-full bg-slate-100 overflow-hidden mt-6 shadow-inner relative z-10 border border-slate-200/50">
                <div id="tb" class="h-full rounded-full transition-all duration-1000 ease-out" style="width:0"></div>
            </div>
        </div>

        <!-- Dynamic Post-Action Container -->
        <div id="action-wrapper">
            <div class="grid grid-cols-2 gap-4 mt-6" id="btn-grid">
                <button id="safe" class="group relative overflow-hidden rounded-3xl p-6 text-center shadow-lg shadow-teal-500/20 hover:shadow-teal-500/40 hover:-translate-y-1 transition-all border border-teal-500/20 bg-gradient-to-br from-teal-400 to-teal-500">
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
                    <div class="relative z-10 flex flex-col items-center gap-2 text-white">
                        <div class="bg-white/20 p-3 rounded-full"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg></div>
                        <span class="text-xl font-extrabold tracking-wide">I'm safe</span>
                    </div>
                </button>
                <button id="help" class="group relative overflow-hidden rounded-3xl p-6 text-center shadow-lg shadow-orange-500/20 hover:shadow-orange-500/40 hover:-translate-y-1 transition-all border border-orange-500/20 bg-gradient-to-br from-orange-400 to-orange-500">
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
                    <div class="relative z-10 flex flex-col items-center gap-2 text-white">
                        <div class="bg-white/20 p-3 rounded-full"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>
                        <span class="text-xl font-extrabold tracking-wide">I need help</span>
                    </div>
                </button>
            </div>
            <div id="msg-container" class="mt-6 transition-all duration-300 empty:hidden"></div>
        </div>

        <div class="mt-10">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-xl text-slate-800">Steps that buy you time</h2>
                <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2 py-1 rounded-md border border-blue-100">Optional</span>
            </div>
            <div id="steps" class="space-y-3"></div>
            <div id="bonus-container" class="mt-4 transition-all duration-300 empty:hidden"></div>
        </div>
    </div>
</section>

<select id="hh" class="hidden"></select>

<script>
let cur, D, householdsDB;

const icons = {
    'flood': '<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>',
    'cold': '<svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>',
    'power': '<svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>',
    'medical': '<svg class="w-6 h-6 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>',
    'supplies': '<svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"></path></svg>'
};

(async () => { householdsDB = await J('/api/households'); })();

// Recovery Toggle
$('#show-recover').onclick = () => $('#recover-panel').classList.toggle('hidden');

// Recovery Action
$('#btn-recover').onclick = async () => {
    const p = $('#rec-phone').value;
    if(!p) return;
    const res = await J(`/api/recover?phone=${encodeURIComponent(p)}`);
    const m = $('#rec-msg');
    m.classList.remove('hidden');
    if(res.ok) {
        m.className = "text-xs font-bold mt-3 text-teal-700 bg-teal-50 p-2 rounded border border-teal-200";
        m.innerHTML = `Found! ID for ${res.mask} is: <b class="text-lg">${res.id}</b>. Enter it above.`;
    } else {
        m.className = "text-xs font-bold mt-3 text-red-600 bg-red-50 p-2 rounded border border-red-200";
        m.textContent = "No household found with that phone number.";
    }
};

$('#find-hh').onclick = () => {
    const val = $('#hh-id').value;
    const match = householdsDB.find(h => h.id == val);
    if(!match) {
        $('#lookup-err').textContent = "Household ID not found. Please try again.";
        $('#lookup-err').classList.remove('hidden');
        $('#active-panel').classList.add('hidden');
        return;
    }
    $('#lookup-err').classList.add('hidden');
    $('#hh').innerHTML = `<option value="${match.id}">#${match.id}</option>`;
    $('#hh').value = match.id;
    $('#active-panel').classList.remove('hidden');
    load();
};

async function load() {
    D = await J('/api/state?level=50&rate=.5&outage=30');
    cur = D.rows.find(r => r.id == $('#hh').value);
    
    // Failsafe applied here
    const z_val = D.zones[cur.zone] || 0; 
    
    $('#zn').innerHTML = `<span class="w-2 h-2 rounded-full ${z_val >= 80 ? 'bg-orange-500' : z_val >= 60 ? 'bg-amber-400' : 'bg-teal-500'}"></span> ${cur.zone} · ${z_val}% (${stageOf(z_val)})`;
    const riskIcon = cur.driver === 'Floodwater' ? icons['flood'] : cur.driver === 'Medical' ? icons['medical'] : cur.driver === 'Cold/heat' ? icons['cold'] : icons['supplies'];
    $('#why').innerHTML = `Main risk: <span class="flex items-center gap-1 bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 ml-1">${riskIcon} <b class="text-slate-800">${cur.driver}</b></span>`;
    
    let tasks = [];
    if (cur.driver === 'Floodwater') {
        tasks.push(['Move to your highest floor with water and medicine.', 90, 'flood']);
        if (cur.floor === 0) tasks.push(['Move valuables off the ground floor.', 30, 'flood']);
        tasks.push(['Switch off mains power to prevent electrical shock.', 30, 'power']);
    } else if (cur.driver === 'Medical') {
        tasks.push(['Connect medical devices to backup power.', 90, 'power']);
        tasks.push(['Prepare emergency medical go-bag by the door.', 45, 'medical']);
    } else if (cur.driver === 'Cold/heat') {
        tasks.push(['Gather blankets in a single, small room.', 45, 'cold']);
        tasks.push(['Seal gaps around doors and windows with towels.', 30, 'cold']);
    } else {
        tasks.push(['Ration remaining food and clean drinking water.', 60, 'supplies']);
    }
    tasks.push(['Switch phone to extreme battery saver mode.', 20, 'power']);

    $('#steps').innerHTML = tasks.map((s) => `
        <label class="flex gap-4 items-center card bg-white border-slate-200 p-4 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:bg-teal-50/50 has-[:checked]:border-teal-400 has-[:checked]:shadow-md group">
            <div class="flex-shrink-0 bg-slate-100 group-has-[:checked]:bg-white p-2.5 rounded-xl border border-slate-200 group-has-[:checked]:border-teal-200 transition-colors">${icons[s[2]]}</div>
            <div class="flex-1">
                <span class="text-slate-700 font-medium text-sm block">${s[0]}</span>
                <span class="text-teal-600 font-bold text-xs mt-1.5 flex items-center gap-1 opacity-80 group-has-[:checked]:opacity-100 transition-opacity"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> +${s[1]} min</span>
            </div>
            <div class="flex-shrink-0 pl-2"><input type="checkbox" class="w-6 h-6 rounded border-slate-300 text-teal-500 focus:ring-teal-500 focus:ring-offset-0 transition-all cursor-pointer shadow-sm" data-m="${s[1]}"></div>
        </label>
    `).join('');
    
    $$('#steps input').forEach(e => e.onchange = tick);
    $('#msg-container').innerHTML = '';
    $('#btn-grid').classList.remove('hidden'); tick(); }  function tick() { const b = $$('#steps input:checked').reduce((a,e) => a + +e.dataset.m, 0);
    const t = cur.tc_eff + b;
    $('#tl').textContent = fmt(t);
    $('#tl').className = 'mono text-5xl tracking-tight ' + col(t);
    $('#tb').style.width = Math.min(100, t/14.4) + '%';
    $('#tb').style.background = col(t) === 'r' ? 'var(--coral-accent)' : col(t) === 'a' ? '#f59e0b' : 'var(--teal-secondary)';
    
    if (b > 0) {
        $('#bonus-container').innerHTML = `<div class="bg-teal-50 text-teal-700 border border-teal-200 rounded-xl p-3 flex items-center justify-center gap-2 font-bold text-sm shadow-sm"><svg class="w-5 h-5 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Confirmed steps added ${b} min to your clock.</div>`;
    } else {
        $('#bonus-container').innerHTML = '';
    }
}

$('#safe').onclick = async () => { const b = $$('#steps input:checked').reduce((a,e) => a + +e.dataset.m, 0);
    await post('/api/checkin', {id: +cur.id, status: 'safe', bonus: b});
    $('#btn-grid').classList.add('hidden');
    $('#msg-container').innerHTML = `<div class="bg-teal-500 text-white p-6 rounded-2xl shadow-lg shadow-teal-500/30 flex flex-col items-center text-center gap-3"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><div><b class="block text-2xl mb-1">Status: SAFE</b><span class="text-teal-50 font-medium">Thank you. Your clock has been paused. Check in again if conditions worsen.</span></div></div>`;
};

$('#help').onclick = async () => { const b = $$('#steps input:checked').reduce((a,e) => a + +e.dataset.m, 0);
    await post('/api/checkin', {id: +cur.id, status: 'help', bonus: b});
    $('#btn-grid').classList.add('hidden');
    $('#msg-container').innerHTML = `<div class="bg-orange-500 text-white p-6 rounded-2xl shadow-lg shadow-orange-500/30 flex flex-col items-center text-center gap-3"><svg class="w-12 h-12 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg><div><b class="block text-2xl mb-1">HELP REQUEST RECEIVED</b><span class="text-orange-50 font-medium">Your priority has been escalated on the command dashboard. Move to your highest floor and keep your phone on.</span></div></div>`;
};
</script>
{% endblock %}
